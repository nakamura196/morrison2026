<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social share card (1200x630). Source for opengraph-image.png /
       twitter-image.png. Japanese set in BIZ UDMincho (brand Mincho).
       Regenerate with scripts/branding/build-icons.zsh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5f1216"/>
      <stop offset="0.55" stop-color="#4c1013"/>
      <stop offset="1" stop-color="#2d090b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- double-rule frame -->
  <rect x="34" y="34" width="1132" height="562" rx="18" fill="none"
        stroke="#f5f0ed" stroke-opacity="0.30" stroke-width="2"/>
  <rect x="44" y="44" width="1112" height="542" rx="12" fill="none"
        stroke="#f5f0ed" stroke-opacity="0.16" stroke-width="1"/>

  <!-- 東洋文庫 logo (same image as the favicon) on a cream chip, so the red
       seal and the dark "TOYO BUNKO" lettering stay legible on the enji ground.
       rsvg-convert resolves the href relative to this file. -->
  <rect x="530" y="66" width="140" height="140" rx="22" fill="#fbf2f2"
        stroke="#f5f0ed" stroke-opacity="0.40" stroke-width="2"/>
  <image x="540" y="76" width="120" height="120" href="toyobunko-logo.png"/>

  <!-- title (two lines) -->
  <g font-family="'BIZ UDPMincho','BIZ UDMincho','Hiragino Mincho ProN',serif"
     font-weight="700" fill="#fbf2f2" text-anchor="middle">
    <text x="600" y="318" font-size="92" letter-spacing="2">モリソンパンフレット</text>
    <text x="600" y="430" font-size="92" letter-spacing="2">統合データベース</text>
  </g>

  <!-- divider -->
  <line x1="520" y1="474" x2="680" y2="474" stroke="#f5f0ed" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- subtitle -->
  <text x="600" y="522" text-anchor="middle"
        font-family="'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans',sans-serif"
        font-size="30" fill="#f5f0ed" fill-opacity="0.84">G.E.モリソン蒐集「モリソンパンフレット」デジタルアーカイブ</text>

  <!-- footer -->
  <text x="600" y="572" text-anchor="middle"
        font-family="'BIZ UDPMincho','BIZ UDMincho','Hiragino Mincho ProN',serif"
        font-size="25" fill="#f5f0ed" fill-opacity="0.62" letter-spacing="3">東洋文庫　THE TOYO BUNKO　·　morrison.toyobunko-lab.jp</text>
</svg>
