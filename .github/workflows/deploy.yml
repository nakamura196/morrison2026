name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 'deploy'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Build (OpenNext for Cloudflare Workers)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_INDEX_NAME: morrison_bib
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Page smoke test (rendered HTML)
        env:
          BASE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: node apps/web/scripts/test-pages.js
