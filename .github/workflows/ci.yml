name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (high 以上で失敗。除外は scripts/audit.mjs に理由と期限つきで書く)
        run: node scripts/audit.mjs
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_INDEX_NAME: morrison_bib
          ALLOWED_INDICES: morrison_bib
